<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临床试验随机化</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}select,button,input{padding:8px;margin:4px}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin-bottom:16px}</style></head>
<body><h1>临床试验随机分配与盲法</h1>
<div class="panel"><select id="user"><option>site1</option><option>site2</option><option>coord</option><option>monitor1</option><option>monitor2</option></select><input id="trial" value="1"><button onclick="load()">查看试验摘要</button></div>
<div class="panel"><h2>中心启停（协调员）</h2>
中心编号 <input id="site" value="S001"> 原因 <input id="reason" placeholder="暂停必填，恢复可填备注" size="32">
<button onclick="suspend()">暂停中心</button><button onclick="resume()">恢复中心</button><button onclick="sites()">查看各中心状态与启停记录</button></div>
<pre id="out"></pre>
<script>
const H=()=>({"X-User-Id":user.value,"Content-Type":"application/json"});
async function show(r){out.textContent=JSON.stringify(await r.json(),null,2)}
async function load(){show(await fetch(`/api/trials/${trial.value}/summary`,{headers:H()}))}
async function sites(){show(await fetch(`/api/trials/${trial.value}/sites`,{headers:H()}))}
async function suspend(){show(await fetch(`/api/trials/${trial.value}/sites/${site.value}/suspend`,{method:"POST",headers:H(),body:JSON.stringify({reason:reason.value})}))}
async function resume(){show(await fetch(`/api/trials/${trial.value}/sites/${site.value}/resume`,{method:"POST",headers:H(),body:JSON.stringify({reason:reason.value})}))}
</script></body></html>
